<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="280" height="200" rx="12" fill="url(#bg)" stroke="#bbf7d0" stroke-width="1"/>
  <text x="140" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#166534">SerpAPI  3 étapes</text>
  <!-- Step 1: Email -->
  <circle cx="40" cy="55" r="14" fill="#166534"/>
  <text x="40" y="59" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">1</text>
  <path d="M62 48 L62 62 L98 62 L98 48 L62 48 Z M62 52 L80 58 L98 52" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="115" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Vérifier ton email</text>
  <!-- Step 2: Phone -->
  <circle cx="40" cy="105" r="14" fill="#166534"/>
  <text x="40" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">2</text>
  <path d="M68 95 L68 115 L72 115 L72 95 L68 95 Z M70 95 L70 90 L76 90 L76 95 M64 108 L76 108 M64 112 L76 112" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="115" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Vérifier ton téléphone</text>
  <!-- Step 3: API Key -->
  <circle cx="40" cy="155" r="14" fill="#166534"/>
  <text x="40" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">3</text>
  <path d="M64 148 L72 148 L76 152 L80 148 L88 148 L88 158 L64 158 Z M70 154 L82 154" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="115" y="158" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Copier la clé API</text>
  <!-- Arrow down -->
  <path d="M140 175 L140 188 M135 183 L140 188 L145 183" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Colle dans Paramètres</text>
</svg>
